name: Source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Python syntax
        run: python3 -m compileall -q ousepet scripts
      - name: Check website references
        run: python3 scripts/check_website.py
